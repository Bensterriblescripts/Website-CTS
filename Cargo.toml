[package]
name = "cts"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
brotli = { version = "9.1.1", default-features = false, features = ["std"] }
flate2 = "1.1.11"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[profile.release]
lto = true
codegen-units = 1
